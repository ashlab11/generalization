hydra:
  run:
    dir: /root/rebuttal_runs/internal_sudoku_post_lr0.001_seed0
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s %(levelname)s]: %(message)s'
        datefmt: '%m/%d/%Y %H:%M:%S'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.handlers.RotatingFileHandler
        formatter: simple
        filename: train.log
    root:
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/root/rebuttal_runs/internal_sudoku_post_lr0.001_seed0
    - hydra.mode=RUN
    task:
    - name=stability_rebuttal
    - +run_id=internal_sudoku_post_lr0.001_seed0
    - problem=sudoku
    - problem/model=transformer
    - problem.hyp.alpha=1
    - problem.hyp.epochs=100
    - problem.hyp.optimizer=adamw
    - problem.hyp.weight_decay=0.01
    - problem.hyp.lr=0.001
    - problem.hyp.seed=0
    - problem.hyp.use_amp=true
    - problem.hyp.train_mode=progressive
    - problem.hyp.rand_method=basic
    - problem.model.test_iterations.low=1
    - problem.model.test_iterations.high=500
    - problem.hyp.train_batch_size=500
    - problem.model.kernel_size=5
    - problem.model.hidden_dim=256
    - problem.model.norm_type=post
    - problem.model.attn_type=full
    - problem.model.num_sinks=0
    - problem.model.num_blocks=1
    - problem.model.max_iters=30
    - problem.model.injection_type=linear
    - problem.model.recall_inner=true
    - problem.model.residual_method=add
    - +problem.model.qk_normalization=true
    - problem.model.init_method=default
    - problem.hyp.full_only_hard=false
    - problem.model.ccot=none
    - compile=true
    - +sweep_name=stability_rebuttal
  job:
    name: train_model
    chdir: null
    override_dirname: +problem.model.qk_normalization=true,+run_id=internal_sudoku_post_lr0.001_seed0,+sweep_name=stability_rebuttal,compile=true,name=stability_rebuttal,problem.hyp.alpha=1,problem.hyp.epochs=100,problem.hyp.full_only_hard=false,problem.hyp.lr=0.001,problem.hyp.optimizer=adamw,problem.hyp.rand_method=basic,problem.hyp.seed=0,problem.hyp.train_batch_size=500,problem.hyp.train_mode=progressive,problem.hyp.use_amp=true,problem.hyp.weight_decay=0.01,problem.model.attn_type=full,problem.model.ccot=none,problem.model.hidden_dim=256,problem.model.init_method=default,problem.model.injection_type=linear,problem.model.kernel_size=5,problem.model.max_iters=30,problem.model.norm_type=post,problem.model.num_blocks=1,problem.model.num_sinks=0,problem.model.recall_inner=true,problem.model.residual_method=add,problem.model.test_iterations.high=500,problem.model.test_iterations.low=1,problem/model=transformer,problem=sudoku
    id: ???
    num: ???
    config_name: train_model_config
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.4
    version_base: '1.1'
    cwd: /root
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/rebuttal_runs/internal_sudoku_post_lr0.001_seed0
    choices:
      problem: sudoku
      problem/model: transformer
      problem/hyp: sudoku_default
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: custom
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
