[project]
name = "deep-thinking"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "comet-ml>=3.44.0",
    "easy-to-hard-data>=1.0.0",
    "einops>=0.8.0",
    "hydra-core>=1.3.2",
    "icecream>=2.1.3",
    "matplotlib>=3.9.0",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "pandas>=2.2.0",
    "Pillow>=10.4.0",
    "scipy>=1.14.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.17.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
cu126 = [
    "torch>=2.5.0",
    "torchvision>=0.20.0",
]
cu128 = [
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[tool.uv]
conflicts = [
    [{ extra = "cu126" }, { extra = "cu128" }],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

