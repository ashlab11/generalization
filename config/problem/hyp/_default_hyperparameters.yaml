alpha: 1
clip:
epochs: 150
lr: 0.001
lr_decay: step
lr_factor: 0.1
lr_schedule:
  - 60
  - 100
lr_throttle: False
optimizer: adamw
weight_decay: 0.0002
save_period: -1
test_batch_size: 500
test_mode: default
train_batch_size: 100
train_mode: progressive
val_period: 10
warmup_period: 10
use_amp: true  # Use automatic mixed precision (bfloat16)